<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>App Inscripción de alumnos</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">

        <div id="app" class="py-5">

            <nav class="navbar navbar-expand-lg bg-body-tertiary px-5 mb-4">
                <div class="container-lg d-flex justify-content-between align-items-center">
                    <div class="" id="">
                        <img src="../public/assets/images/logo.png" class="rounded float-start" height="100" alt="">
                    </div>
                    <div class="" id="">
                        <a class="btn btn-outline-success" href="../admin/index.html" >Admin</a>
                    </div>
                </div>
            </nav>
            <nav class="navbar navbar-expand-lg bg-primary px-5 mb-4">
                <div class="container-lg">
                    <h2 class="text-light">Formulario de inscripción online</h2>
                </div>
            </nav>
            <div class="container-lg bg-white p-4 rounded shadow-sm">
                <div v-if="message.text"
                    :class="['alert', message.type === 'error' ? 'alert-danger' : 'alert-success']">
                    {{ message.text }}
                </div>
                <div class="d-flex justify-content-center">
                    <form @submit.prevent="submitForm">
                        <div class="mb-3">
                            <label for="" class="form-label">Nombre</label>
                            <input type="text" class="form-control" v-model="form.nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="" class="form-label">Email </label>
                            <input type="email" class="form-control" v-model="form.email" required>
                        </div>
                        <div class="mb-3">
                            <label for="" class="form-label">Télefono</label>
                            <input type="text" class="form-control" v-model="form.telefono" aria-describedby="phoneHelp" required>
                            <div id="phoneHelp" class="form-text">Para números extrangeros indica el codigo de area, ejemplo: +54.</div>
                        </div>
                        <div class="mb-3">
                            <label for="" class="form-label">Nacionalidad</label>
                            <input type="text" class="form-control" v-model="form.nacionalidad" required>
                        </div>
                        <div class="mb-3">
                            <label for="" class="form-label">Carrera</label>
                            <select class="form-select" aria-label="Selecciona una carrera" v-model.number="form.carrera_id" required>
                                <option value="" disabled>Selecciona una carrera</option>
                                <option v-for="carrera in carreras" :key="carrera.id" :value="carrera.id">{{ carrera.nombre }}</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Inscribirse</button>
                    </form>
                </div>
            </div>

        </div>
        
        
        <script src="" async defer></script>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const { createApp } = Vue;

            createApp({
                data() {
                    return {
                        carreras: [],
                        form: {
                            nombre: '',
                            email: '',
                            telefono: '',
                            nacionalidad: '',
                            carrera_id: null
                        },
                        message: {
                            text: '',
                            type: '' // 'success' | 'error'
                        }
                    };
                },
                async mounted() {
                    try {
                        const res = await fetch('/api/carreras.pl', {
                            headers: { 'Accept': 'application/json' } 
                        });
                        if (!res.ok) throw new Error('No se pudieron cargar las carreras');

                        const data = await res.json();
                        this.carreras = data.carreras || [];
                    } catch (e) {
                        this.message = { 
                            text: 'Error cargando carreras. Intenta nuevamente.', 
                            type: 'error' 
                        };
                    }
                },
                methods: {
                    async submitForm() {
                        this.message.text = '';
                        this.message.type = '';
                        
                        // Validación campos obligatorios
                        if (!this.form.nombre || !this.form.email || !this.form.telefono || !this.form.nacionalidad || !this.form.carrera_id) {
                            this.message = {
                            text: 'Por favor complete los campos obligatorios.',
                            type: 'error'
                            };
                            return;
                        }
                        //Validacion de formato de email
                        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (!emailPattern.test(this.form.email)) {
                            this.message = {
                                text: 'Ingrese un correo electrónico válido.',
                                type: 'error'
                            };
                            return;
                        }
                        try {
                            const payload = { ...this.form, carrera_id: Number(this.form.carrera_id) };
                            const res = await fetch('/api/inscripciones.pl', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                                body: JSON.stringify(payload),
                            });

                            if (res.status === 201) {
                                this.message = { text: 'Inscripción realizada con éxito.', type: 'success' };
                                
                                // Reset formulario
                                this.form.nombre = '';
                                this.form.email = '';
                                this.form.telefono = '';
                                this.form.nacionalidad = '';
                                this.form.carrera_id = '';
                                return;
                            }

                            if(res.status === 409) {
                                this.message = { text: 'El alumno ya esta inscrito | email duplicado.', type: 'error' };
                                return;
                            }
                            if(res.status === 400) {
                                const error = await res.json().catch(() => null);
                                this.message = { text: error?.error ? `Error: ${error.error}` : 'Datos inválidos.', type: 'error' };
                                return;
                            }
                            this.message = { text: 'Ocurrió un error durante el proceso de inscripción.', type: 'error' };
                        } catch (e) {
                            this.message = { text: 'Error enviando la inscripción. Intenta nuevamente.', type: 'error' };
                            return;
                        }
                    }
                }
            }).mount('#app');
        </script>
    </body>
</html>
